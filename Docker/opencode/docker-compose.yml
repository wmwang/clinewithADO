---
# =============================================================================
# OpenCode CLI - Docker Compose
# =============================================================================
# Usage:
#   1. Copy .env.example to .env and fill in your credentials
#   2. docker compose run --rm opencode                 # interactive session
#   3. docker compose run --rm opencode run "fix tests" # headless task
# =============================================================================

services:
  opencode:
    image: ${DOCKER_IMAGE:-your-org/opencode}:${IMAGE_TAG:-latest}
    # To build locally instead of pulling:
    # build:
    #   context: .
    #   args:
    #     OPENCODE_VERSION: "latest"

    environment:
      # ── AI Provider (OpenAI-compatible) ──────────────────────────────────────
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Optional: custom endpoint (Azure OpenAI, Ollama, vLLM, etc.)
      # - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      # Optional: model override
      # - OPENCODE_MODEL=${OPENCODE_MODEL:-}

      # ── Azure DevOps (optional) ──────────────────────────────────────────────
      # Set ADO_PAT to enable az devops CLI and azure-devops Python SDK auth.
      # ADO_ORG is required when ADO_PAT is set; ADO_PROJECT is optional.
      # - ADO_ORG=${ADO_ORG:-}           # org name, e.g. contoso
      # - ADO_PAT=${ADO_PAT:-}           # Personal Access Token
      # - ADO_PROJECT=${ADO_PROJECT:-}   # default project name

      # ── Corporate Proxy (optional) ───────────────────────────────────────────
      # - HTTPS_PROXY=${HTTPS_PROXY:-}
      # - HTTP_PROXY=${HTTP_PROXY:-}
      # - NO_PROXY=${NO_PROXY:-}

    volumes:
      # Mount your project as the working directory
      - .:/workspace

      # Persist OpenCode config & settings across sessions
      - opencode-data:/home/node/.opencode

    working_dir: /workspace

    # Required for OpenCode's interactive TUI
    stdin_open: true
    tty: true

volumes:
  opencode-data:
    driver: local
